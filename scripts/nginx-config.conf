# Configuración de Nginx para MLTrack
# Guardar como /etc/nginx/sites-available/mltrack

server {
    listen 80;
    server_name sqsoft.top www.sqsoft.top;

    # Redirigir HTTP a HTTPS (opcional, descomenta cuando tengas SSL)
    # return 301 https://$server_name$request_uri;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Configuración para archivos estáticos
    client_max_body_size 10M;
    
    # Backend API - Proxy a Fastify
    location /mltrack/api {
        proxy_pass http://localhost:3006/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Socket.IO - Proxy para WebSocket
    location /mltrack/socket.io/ {
        proxy_pass http://localhost:3006/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Health check del backend
    location /mltrack/health {
        proxy_pass http://localhost:3006/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend - Archivos estáticos de React
    location /mltrack {
        alias /var/www/apps/mltrack/frontend/dist;
        try_files $uri $uri/ /mltrack/index.html;
        
        # Headers para PWA
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Headers para archivos estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Service Worker - No cache
    location /mltrack/sw.js {
        alias /var/www/apps/mltrack/frontend/dist/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Manifest PWA
    location /mltrack/manifest.json {
        alias /var/www/apps/mltrack/frontend/dist/manifest.json;
        add_header Content-Type "application/json";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Favicon
    location /mltrack/favicon.ico {
        alias /var/www/apps/mltrack/frontend/dist/favicon.ico;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Robots.txt
    location /mltrack/robots.txt {
        alias /var/www/apps/mltrack/frontend/dist/robots.txt;
        add_header Content-Type "text/plain";
    }

    # Redirigir root a /mltrack
    location = / {
        return 301 /mltrack;
    }

    # Manejar errores 404
    error_page 404 /mltrack/index.html;

    # Logs
    access_log /var/log/nginx/mltrack_access.log;
    error_log /var/log/nginx/mltrack_error.log;
}

